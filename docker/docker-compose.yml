name: spark-telemetry

services:
  mimir:
    image: grafana/mimir:${MIMIR_VERSION:-3.1.0}
    network_mode: host
    command:
      - -config.file=/etc/mimir/mimir.yaml
    restart: unless-stopped
    volumes:
      - ./mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - mimir-data:/tmp/mimir

  loki:
    image: grafana/loki:${LOKI_VERSION:-3.7.3}
    network_mode: host
    command:
      - -config.file=/etc/loki/loki.yaml
    restart: unless-stopped
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-3.0.0}
    network_mode: host
    command:
      - -target=all
      - -config.file=/etc/tempo/tempo.yaml
    restart: unless-stopped
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  pyroscope:
    image: grafana/pyroscope:${PYROSCOPE_VERSION:-2.2.0}
    network_mode: host
    command:
      - -config.file=/etc/pyroscope/config.yaml
    restart: unless-stopped
    volumes:
      - ./pyroscope/pyroscope.yaml:/etc/pyroscope/config.yaml:ro
      - pyroscope-data:/data
      - pyroscope-compactor-data:/data-compactor
      - pyroscope-metastore-data:/data-metastore

  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.18.1}
    network_mode: host
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    restart: unless-stopped
    depends_on:
      - mimir
      - loki
      - tempo
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.1.3}
    network_mode: host
    restart: unless-stopped
    depends_on:
      - mimir
      - loki
      - tempo
      - pyroscope
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_PLUGINS_PREINSTALL_SYNC: grafana-pyroscope-app
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  alloy-data:
  mimir-data:
  loki-data:
  tempo-data:
  pyroscope-data:
  pyroscope-compactor-data:
  pyroscope-metastore-data:
  grafana-data:
